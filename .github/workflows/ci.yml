name: CI

on:
  push:
    branches-ignore: [main] # main runs CI inside deploy.yml (CI → deploy dev → smoke)
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      dynamodb: # integration tests (BR-1/6/8/9) run against DynamoDB Local
        image: amazon/dynamodb-local:2.5.4
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from package.json "packageManager")
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level high
      - name: cdk-nag (AwsSolutions) on both stages
        working-directory: infra
        run: |
          npx cdk synth -q -c stage=dev
          npx cdk synth -q -c stage=prod

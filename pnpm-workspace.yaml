packages:
  - packages/*
  - services/*
  - apps/*
  - infra
  - e2e
allowBuilds:
  esbuild: true
  msw: false # postinstall only copies public/mockServiceWorker.js, which is committed
minimumReleaseAgeExclude:
  - aws-cdk-lib@2.277.0
  - '@aws-sdk/client-dynamodb@3.1169.0'
  - '@aws-sdk/client-secrets-manager@3.1169.0'
  - '@aws-sdk/lib-dynamodb@3.1169.0'
  - '@aws-sdk/client-dynamodb-streams@3.1169.0'
  - '@aws-sdk/client-kms@3.1169.0'
  - '@aws-sdk/client-sesv2@3.1169.0'
  - '@aws-sdk/client-cognito-identity-provider@3.1169.0'
  - '@aws-sdk/client-lambda@3.1169.0'
  - lucide-react@1.73.0

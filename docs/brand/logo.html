<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
  .tile {
    width: 1024px; height: 1024px; border-radius: 224px;
    background: linear-gradient(160deg, #6a3600 0%, #7b3f00 45%, #a8652f 100%);
    display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .glow { position: absolute; inset: -30%; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.22), transparent 45%); }
  svg { width: 600px; height: 600px; position: relative; }
  .dot { position: absolute; right: 190px; top: 200px; width: 120px; height: 120px; border-radius: 50%;
    background: #3ecf8e; border: 22px solid #fff; box-sizing: border-box; }
</style>
</head>
<body>
  <div class="tile">
    <div class="glow"></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 4h3a2 2 0 0 1 2 2v14" />
      <path d="M2 20h3" />
      <path d="M13 20h9" />
      <path d="M10 12v.01" stroke-width="2.6" />
      <path d="M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z" />
    </svg>
    <div class="dot"></div>
  </div>
</body>
</html>
